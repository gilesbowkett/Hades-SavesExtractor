[package]
name = "hades-saves-extractor"
version = "0.1.0"
edition = "2021"
description = "Extract and import Hades save files"

[dependencies]
lz4 = "1.25"
mlua = { version = "0.9", features = ["lua52", "vendored"] }
adler = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
